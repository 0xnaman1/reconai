[project]
name = "recon-ai-api"
version = "0.1.0"
description = "FastAPI backend for Recon AI."
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16.4",
  "fastapi>=0.116.1",
  "python-multipart>=0.0.20",
  "recon-ai-core",
  "uvicorn[standard]>=0.35.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_ai_api"]

[tool.uv.sources]
recon-ai-core = { workspace = true }
