[project]
name = "recon-ai-worker"
version = "0.1.0"
description = "RQ worker for Recon AI."
requires-python = ">=3.14"
dependencies = [
  "recon-ai-core",
  "redis>=6.4.0",
  "rq>=2.4.1"
]

[project.scripts]
recon-worker = "recon_ai_worker.main:main"
enqueue-sample-job = "recon_ai_worker.enqueue_sample:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_ai_worker"]

[tool.uv.sources]
recon-ai-core = { workspace = true }
