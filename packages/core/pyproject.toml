[project]
name = "recon-ai-core"
version = "0.1.0"
description = "Shared core package for Recon AI."
requires-python = ">=3.14"
dependencies = [
  "openai>=1.99.0",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pypdf>=5.9.0",
  "python-dotenv>=1.1.1",
  "rapidfuzz>=3.13.0",
  "redis>=6.4.0",
  "rq>=2.4.1",
  "sqlalchemy>=2.0.43",
  "supabase>=2.18.1",
]

[project.scripts]
verify-supabase = "recon_ai_core.verify_supabase:main"
verify-storage = "recon_ai_core.verify_storage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_ai_core"]
